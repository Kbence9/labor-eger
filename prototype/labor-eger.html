<style>
/* Layout: one-screen lab notebook — HUD strip on top, maze sheet in the middle, hand-written notes as overlays. Single paper look by choice. */
:root {
  color-scheme: light;
  --paper: #edf0ea;      /* pale lab-notebook paper */
  --sheet: #f6f7f2;      /* the maze sheet */
  --ink: #1e2233;        /* ballpoint ink */
  --ink-soft: #5d6577;   /* pencil notes */
  --rule: #c9d0cf;       /* faint dots/rules */
  --pen: #2c3e91;        /* blue pen accent for buttons */
  --mark: #c8352e;       /* red correction pen: deaths */
  --ok: #2f8a4a;         /* start green */
  --exit: #7a3fa0;       /* exit purple */
  --f-hand: 'Kalam', 'Comic Sans MS', 'Segoe Print', cursive;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-hand); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.stats { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.stat small { font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.stat strong { font-size: 1.05rem; font-weight: 600; }
.stat.deaths strong { color: var(--mark); }

<script>// ---- Labor logic (shared by game + solver) ----
(function (root) {
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const k = (x, y) => x + ',' + y;
  const ek = (a, b, c, d) => (a < c || (a === c && b < d)) ? `${a},${b}|${c},${d}` : `${c},${d}|${a},${b}`;

  function parseLevel(def) {
    const open = new Set();
    for (const p of def.paths) {
      const pts = p.trim().split(/\s+/).map(s => s.split(',').map(Number));
      for (let i = 1; i < pts.length; i++) {
        const [a, b] = pts[i - 1], [c, d] = pts[i];
        if (Math.abs(a - c) + Math.abs(b - d) !== 1) throw new Error(`${def.name}: nem szomszédos ${a},${b} -> ${c},${d}`);
        open.add(ek(a, b, c, d));
      }
    }
    const brk = new Set((def.brk || []).map(s => { const [p, q] = s.split('|'); const [a, b] = p.split(',').map(Number); const [c, d] = q.split(',').map(Number); return ek(a, b, c, d); }));
    for (const e of brk) if (open.has(e)) throw new Error(`${def.name}: törhető fal nyitott élen ${e}`);
    const obj = Object.assign({}, def.obj);
    let start = null, portals = {};
    for (const [key, v] of Object.entries(obj)) {
      if (v === 'S') start = key.split(',').map(Number);
      if (/^[AB]$/i.test(v)) { (portals[v.toUpperCase()] = portals[v.toUpperCase()] || []).push(key); }
    }
    const pair = {};
    for (const [id, list] of Object.entries(portals)) {
      if (list.length !== 2) throw new Error(`${def.name}: portál ${id} nem pár`);
      pair[list[0]] = list[1]; pair[list[1]] = list[0];
    }
    return { name: def.name, C: def.C, R: def.R, open, brk, obj, start, pair };
  }

  function initState(L) {
    const items = {}, fires = {}, cracks = {}, traps = {};
    let exit = null;
    for (const [key, v] of Object.entries(L.obj)) {
      if (v === 'H' || v === 'W') items[key] = v;
      if (v === 'F') fires[key] = true;
      if (v === 'C') cracks[key] = 'ok';
      if (v === 'T') traps[key] = true;
      if (v === 'E') exit = key;
    }
    return { x: L.start[0], y: L.start[1], held: null, items, fires, cracks, traps, exit, broken: {}, dead: null, won: false };
  }

  function clone(s) {
    return { x: s.x, y: s.y, held: s.held, items: { ...s.items }, fires: { ...s.fires }, cracks: { ...s.cracks }, traps: s.traps, exit: s.exit, broken: { ...s.broken }, dead: s.dead, won: s.won };
  }

  // edge type from (x,y) toward dir: 'open' | 'wall' | 'brk'
  function edge(L, s, x, y, dir) {
    const [dx, dy] = DIRS[dir];
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= L.C || ny >= L.R) return 'wall';
    const e = ek(x, y, nx, ny);
    if (L.open.has(e) || s.broken[e]) return 'open';
    if (L.brk.has(e)) return 'brk';
    return 'wall';
  }

  // One step attempt. Mutates s, returns list of events.
  function step(L, s, dir) {
    const ev = [];
    if (s.dead || s.won) return ev;
    const t = edge(L, s, s.x, s.y, dir);
    if (t === 'wall') { ev.push({ t: 'blocked' }); return ev; }
    const [dx, dy] = DIRS[dir];
    if (t === 'brk') {
      if (s.held === 'H') { s.broken[ek(s.x, s.y, s.x + dx, s.y + dy)] = true; ev.push({ t: 'break', x: s.x, y: s.y, dir }); }
      else ev.push({ t: 'bonk' });
      return ev;
    }
    const from = k(s.x, s.y);
    if (s.cracks[from] === 'ok') { s.cracks[from] = 'hole'; ev.push({ t: 'crumble', key: from }); }
    s.x += dx; s.y += dy;
    ev.push({ t: 'move' });
    enter(L, s, ev);
    return ev;
  }

  function enter(L, s, ev, viaPortal) {
    const key = k(s.x, s.y);
    if (s.cracks[key] === 'hole') { s.dead = 'fall'; ev.push({ t: 'die', why: 'fall' }); return; }
    if (s.fires[key]) {
      if (s.held === 'W') { delete s.fires[key]; s.held = null; ev.push({ t: 'douse', key }); }
      else { s.dead = 'burn'; ev.push({ t: 'die', why: 'burn' }); return; }
    }
    if (s.traps[key]) { s.dead = 'trap'; ev.push({ t: 'die', why: 'trap' }); return; }
    if (s.items[key]) {
      const got = s.items[key];
      if (s.held) s.items[key] = s.held; else delete s.items[key];
      ev.push({ t: s.held ? 'swap' : 'pick', got, left: s.held });
      s.held = got;
    }
    if (key === s.exit) { s.won = true; ev.push({ t: 'win' }); return; }
    if (s.cracks[key] === 'ok') ev.push({ t: 'oncrack', key });
    if (!viaPortal && L.pair[key]) {
      const [px, py] = L.pair[key].split(',').map(Number);
      s.x = px; s.y = py; ev.push({ t: 'teleport', from: key });
      enter(L, s, ev, true);
    }
  }

  function stateKey(s) {
    const o = x => Object.keys(x).sort().map(q => q + '=' + x[q]).join(';');
    return [s.x, s.y, s.held, o(s.items), o(s.fires), o(s.cracks), o(s.broken)].join('/');
  }

  // BFS solver over single steps; returns shortest list of dirs or null
  function solve(L, start) {
    const s0 = start ? clone(start) : initState(L);
    const q = [[s0, []]]; const seen = new Set([stateKey(s0)]);
    while (q.length) {
      const [s, path] = q.shift();
      for (const d of 'UDLR') {
        const n = clone(s); const ev = step(L, n, d);
        if (ev.length === 1 && (ev[0].t === 'blocked' || ev[0].t === 'bonk')) continue;
        if (n.dead) continue;
        if (n.won) return path.concat(d);
        const key = stateKey(n); if (seen.has(key)) continue; seen.add(key);
        q.push([n, path.concat(d)]);
      }
    }
    return null;
  }

  const api = { DIRS, k, ek, parseLevel, initState, clone, edge, step, solve, stateKey };
  if (typeof module !== 'undefined') module.exports = api; else root.LabLogic = api;
})(this);
</script>

<script>
(function () {
  const G = LabLogic, LV = LAB_LEVELS;
  const STEP_MS = 85, CRACK_MS = 450, DEATH_MS = 1150;
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const slot = $('slot'), sctx = slot.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const COL = { paper: css('--sheet') || '#f6f7f2', ink: css('--ink') || '#1e2233', rule: css('--rule') || '#c9d0cf', mark: css('--mark') || '#c8352e', ok: css('--ok') || '#2f8a4a', exit: css('--exit') || '#7a3fa0', soft: css('--ink-soft') || '#5d6577' };
  const PORTAL_COL = { A: '#e0679b', B: '#18a3a0' };

  // ---------- persistent-ish session state ----------
  const hot = window.claude && window.claude.hot;
  let save = { lvl: 0, totalDeaths: 0, done: [] };
  function loadSave() { try { const v = JSON.parse(localStorage.getItem('labor-eger') || 'null'); if (v && typeof v.lvl === 'number') save = Object.assign(save, v); } catch (e) {} }
  function writeSave() { try { localStorage.setItem('labor-eger', JSON.stringify(save)); } catch (e) {} }

  // ---------- game state ----------
  let L, s, lvlIdx = 0, mode = 'title';
  let deaths = 0, tStart = null, tEnd = null, markers = [], wob = {};
  let disp = { x: 0, y: 0 }, anim = null, moving = false, curDir = null, queue = null, crackAt = null, bump = null, faceDir = 'U';
  let particles = [], deathInfo = null, deathTimer = null, flash = 0;
  let cell = 40, ox = 0, oy = 0, W = 0, H = 0;

  // ---------- audio ----------
  let ac = null, soundOn = true;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === 'suspended') ac.resume(); }
  function tone(f0, f1, dur, type, vol) {
    if (!ac || !soundOn) return; const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, vol, hp) {
    if (!ac || !soundOn) return; const t = ac.currentTime, n = Math.floor(ac.sampleRate * dur);
    const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = b; const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
    const g = ac.createGain(); g.gain.value = vol || .1; src.connect(f).connect(g).connect(ac.destination); src.start(t);
  }
  const sfx = {
    step() { tone(900, 700, .03, 'triangle', .02); },
    bonk() { tone(140, 70, .12, 'sine', .15); },
    pick() { tone(660, 990, .08, 'square', .05); setTimeout(() => tone(990, 1320, .08, 'square', .05), 70); },
    brk() { noise(.25, .25, 300); tone(120, 50, .2, 'sawtooth', .06); },
    douse() { noise(.5, .12, 2500); },
    tele() { tone(300, 1600, .25, 'sine', .08); },

    for (let y = -1; y <= L.R + 1; y++) for (let x = -1; x <= L.C + 1; x++) { ctx.beginPath(); ctx.arc(ox + x * cell, oy + y * cell, Math.max(1, cell * .035), 0, 7); ctx.fill(); }
    const now = t;
    // floor features
    for (const [key, st] of Object.entries(s.cracks)) { const [x, y] = key.split(',').map(Number); if (st === 'hole') drawHole(cx(x), cy(y), cell); else drawCrack(cx(x), cy(y), cell, now, crackAt && s.x === x && s.y === y); }
    // death markers
    ctx.lineCap = 'round';
    for (const m of markers) { const x = cx(m.x), y = cy(m.y), r = cell * .16; ctx.strokeStyle = 'rgba(200,53,46,.5)'; ctx.lineWidth = Math.max(1.5, cell * .05); ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke(); }
    // portals
    for (const [key, v] of Object.entries(L.obj)) if (/^[ab]$/i.test(v)) { const [x, y] = key.split(',').map(Number); drawPortal(cx(x), cy(y), cell * .4, PORTAL_COL[v.toUpperCase()], now); }
    // walls
    const lw = Math.max(2, cell * .085);
    const exitKey = s.exit, [ex, ey] = exitKey.split(',').map(Number), exitSide = outerSide(ex, ey);
    const [sx0, sy0] = L.start, startSide = outerSide(sx0, sy0);
    const isGap = (x, y, dir) => (x === ex && y === ey && dir === exitSide) || (x === sx0 && y === sy0 && dir === startSide);
    for (let y = 0; y < L.R; y++) for (let x = 0; x < L.C; x++) {
      // right edge & bottom edge of each cell, plus top/left borders
      const edges = [['R', [x + 1, y], [x + 1, y + 1]], ['D', [x, y + 1], [x + 1, y + 1]]];
      if (y === 0) edges.push(['U', [x, y], [x + 1, y]]);
      if (x === 0) edges.push(['L', [x, y], [x, y + 1]]);
      for (const [d, a, b] of edges) {
        const tpe = G.edge(L, s, x, y, d);
        if (tpe === 'open') continue;
        const pa = dot(a[0], a[1]), pb = dot(b[0], b[1]);
        if (tpe === 'brk') { drawBricks(pa, pb); continue; }
        if (isGap(x, y, d)) continue;
        inkLine(pa, pb, lw);
      }
    }
    // broken-wall rubble
    for (const e of Object.keys(s.broken)) { const [p, q] = e.split('|'); const [a, b] = p.split(',').map(Number), [c, d] = q.split(',').map(Number); const mx = (cx(a) + cx(c)) / 2, my = (cy(b) + cy(d)) / 2; ctx.fillStyle = 'rgba(168,85,63,.45)'; for (let i = 0; i < 5; i++) { ctx.fillRect(mx + (hash(a, i, 1) - .5) * cell * .4, my + (hash(b, i, 2) - .5) * cell * .4, cell * .07, cell * .05); } }
    drawArrow(ex, ey, exitSide, COL.exit, false);
    drawArrow(sx0, sy0, startSide, COL.ok, true);
    // items
    for (const [key, v] of Object.entries(s.items)) { const [x, y] = key.split(',').map(Number); const bob = Math.sin(now / 300 + x) * cell * .02; if (v === 'H') drawHammer(ctx, cx(x), cy(y) + bob, cell * .32); else drawFlask(ctx, cx(x), cy(y) + bob, cell * .3); }
    for (const key of Object.keys(s.traps)) { const [x, y] = key.split(',').map(Number); drawCheese(cx(x), cy(y), cell * .32); }
    for (const key of Object.keys(s.fires)) { const [x, y] = key.split(',').map(Number); drawFire(cx(x), cy(y) + cell * .05, cell * .36, now); }
    // mouse
    let mx = disp.x, my = disp.y;
    if (anim) { const k = Math.min(1, (now - anim.t0) / STEP_MS); mx = anim.fx + (anim.tx - anim.fx) * k; my = anim.fy + (anim.ty - anim.fy) * k; }
    let bx = 0, by = 0;
    if (bump) { const k = (now - bump.t0) / 140; if (k > 1) bump = null; else { const [dx, dy] = G.DIRS[bump.dir]; const a = Math.sin(k * Math.PI) * .12; bx = dx * a; by = dy * a; } }
    let scale = 1;
    if (deathInfo && deathInfo.why === 'fall') scale = Math.max(0, 1 - (now - deathInfo.t0) / 500);
    if (scale > 0) { ctx.save(); const px = cx(mx + bx), py = cy(my + by); ctx.translate(px, py); ctx.scale(scale, scale); ctx.translate(-px, -py); drawMouse(px, py, faceDir, now, s.held, !!deathInfo); ctx.restore(); }
    // particles
    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; const px = cx(p.x), py = cy(p.y), r = p.size * cell; if (p.shape === 'sq') ctx.fillRect(px - r / 2, py - r / 2, r, r); else { ctx.beginPath(); ctx.arc(px, py, r / 2, 0, 7); ctx.fill(); } }
    ctx.globalAlpha = 1;
    if (flash > 0) { ctx.fillStyle = 'rgba(197,107,214,' + (flash * .25) + ')'; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - .06); }
    ctx.restore();
  }
  function drawBricks(pa, pb) {
    const horiz = Math.abs(pa[1] - pb[1]) < Math.abs(pa[0] - pb[0]);
    const th = cell * .2;
    ctx.save();
    const x0 = Math.min(pa[0], pb[0]), y0 = Math.min(pa[1], pb[1]);
    const len = horiz ? Math.abs(pb[0] - pa[0]) : Math.abs(pb[1] - pa[1]);
    ctx.translate(horiz ? x0 : x0, horiz ? y0 : y0);
    if (!horiz) { ctx.rotate(Math.PI / 2); }
    ctx.fillStyle = '#b4573f'; ctx.strokeStyle = COL.ink; ctx.lineWidth = Math.max(1.2, cell * .04);
    ctx.fillRect(0, -th / 2, len, th); ctx.strokeRect(0, -th / 2, len, th);
    ctx.strokeStyle = '#f0d9c8'; ctx.lineWidth = Math.max(1, cell * .025);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, 0);
    for (let i = 1; i < 4; i++) { ctx.moveTo(len * i / 4, -th / 2); ctx.lineTo(len * i / 4, 0); }
    for (let i = 0; i < 4; i++) { ctx.moveTo(len * (i + .5) / 4, 0); ctx.lineTo(len * (i + .5) / 4, th / 2); }
    ctx.stroke(); ctx.restore();
  }

  // ---------- loop ----------
  function frame(t) {
    if (L) {
      if (anim && t - anim.t0 >= STEP_MS) arrive();
      if (crackAt && mode === 'play' && !s.dead && t - crackAt >= CRACK_MS) {
        const key = s.x + ',' + s.y;
        if (s.cracks[key] === 'ok' && !moving) { s.cracks[key] = 'hole'; dust(s.x, s.y); die('fall'); }
        crackAt = null;
      }
      for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= p.decay; }
      particles = particles.filter(p => p.life > 0);
      if (mode === 'play' || mode === 'win') {
        const el = tStart === null ? 0 : (tEnd || t) - tStart;
        $('time').textContent = fmt(el);
      }
      draw(t);
    }
    requestAnimationFrame(frame);
  }

  // ---------- menus ----------
  function renderChips() {
    const box = $('chips'); box.innerHTML = '';
    LV.forEach((lv, i) => { const b = document.createElement('button'); b.className = 'chip' + (save.done.includes(i) ? ' done' : ''); b.textContent = String(i + 1).padStart(2, '0'); b.title = lv.name; b.addEventListener('click', () => startLevel(i)); box.appendChild(b); });
  }
  function startLevel(i) { audio(); $('ovTitle').hidden = true; $('ovWin').hidden = true; $('toast').hidden = true; loadLevel(i); mode = 'play'; }
  function showMenu() { mode = 'title'; renderChips(); $('ovWin').hidden = true; $('toast').hidden = true; $('ovTitle').hidden = false; }
  $('btnStart').addEventListener('click', () => startLevel(save.done.length >= LV.length ? 0 : save.lvl));
  $('btnNext').addEventListener('click', () => startLevel(lvlIdx === LV.length - 1 ? 0 : lvlIdx + 1));
  $('btnMenu').addEventListener('click', showMenu);
  $('btnMenu2').addEventListener('click', showMenu);
  $('btnRestart').addEventListener('click', () => { audio(); if (mode === 'play') restart(); });
  $('btnSound').addEventListener('click', () => { soundOn = !soundOn; $('btnSound').textContent = 'Hang ' + (soundOn ? '✓' : '✕'); audio(); });

  // debug hook for automated checks
  window.__labor = { input, busy: () => moving || !!anim || !!deathInfo, solveNext: () => { const p = G.solve(L, s); return p && p[0]; }, deaths: () => deaths, state: () => s, level: () => lvlIdx, mode: () => mode, start: startLevel };

  function boot(data) {
    loadSave();
    if (data && typeof data.lvl === 'number') save.lvl = data.lvl;
    loadLevel(Math.min(save.lvl, LV.length - 1)); renderChips();
    requestAnimationFrame(frame);
  }
  if (hot && hot.snapshot) hot.snapshot(() => ({ lvl: lvlIdx }));
  if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data || {});
})();
</script>
